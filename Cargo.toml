[package]
name = "oscillation"
version = "0.1.2"
authors = ["Sigurd Sætherø Spangelo"]
edition = "2024"
license = "MIT"
description = "Oscillators and a collection of waveforms for real-time usage."
repository = "https://github.com/sigurd4/oscillation"
keywords = ["wavetable", "vst", "real-time", "waveforms", "synthesizers"]
categories = ["algorithms", "mathematics", "multimedia::audio", "no-std::no-alloc"]
exclude = ["plots/"]

[dependencies]
moddef = "0.3.0"
rand = {version = "0.10.3", default-features = false}
num-traits = {version = "0.2.19", default-features = false}
num-complex = "0.4.6"
serde = {version = "1.0.229", default-features = false, features = ["derive"]}
complex-bessel = { version = "0.3.0", default-features = false }

[dev-dependencies]
plotters = "0.3.7"
linspace = "0.3.0"
